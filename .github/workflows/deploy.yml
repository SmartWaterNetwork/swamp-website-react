name: SWAMP Deployment Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          # Desactivamos clean automático porque falla si PM2 bloquea archivos
          clean: false

      - name: Liberar puerto y archivos bloqueados (Windows Fix)
        shell: cmd
        run: |
          echo === Deteniendo servidores para liberar archivos ===
          :: Intentar matar el proceso por nombre de PM2
          call pm2 stop swamp-website || echo "Ya detenido"
          call pm2 delete swamp-website || echo "Nada que borrar"
          
          :: Fuerza bruta: matar cualquier proceso que use el puerto 3000 (Vite/Serve)
          for /f "tokens=5" %%a in ('netstat -aon ^| findstr :3000') do taskkill /f /pid %%a || echo "No hay procesos en puerto 3000"
          
          :: Ahora que el puerto está libre, forzamos limpieza manual si es necesario
          :: (Solo borramos dist, el checkout se encargará del resto)
          if exist "%GITHUB_WORKSPACE%\dist" rmdir /s /q "%GITHUB_WORKSPACE%\dist"

      - name: Instalar y Construir
        shell: cmd
        run: |
          echo === Trabajando en el Workspace del Runner ===
          :: Instalamos y generamos la carpeta 'dist' aquí mismo
          call npm install
          call npm run build

      - name: Despliegue con PM2
        shell: cmd
        run: |
          echo === Actualizando PM2 ===
          
          :: Borramos la instancia previa para evitar conflictos de puerto
          call pm2 delete swamp-website || echo "Nada que borrar"
          
          :: Iniciamos usando la ruta dinamica de GitHub Workspace
          :: Esto apunta a C:\actions-runner\_work\swamp-website-react\swamp-website-react\dist
          call pm2 start "%SWAMP_SERVE_JS%" --name "swamp-website" -- -s "%GITHUB_WORKSPACE%\dist" -l 3000
          
          :: Guardamos para que el proceso sea persistente
          call pm2 save
          
          :: Verificamos que el estado sea 'online'
          call pm2 list