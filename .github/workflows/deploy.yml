name: SWAMP Deployment Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Preparar entorno (Mover archivos bloqueados)
        shell: cmd
        continue-on-error: true
        run: |
          if exist "%GITHUB_WORKSPACE%\dist" (
            echo Carpeta dist detectada, moviendo para evitar bloqueo de EPERM...
            move "%GITHUB_WORKSPACE%\dist" "%TEMP%\dist_old_%RANDOM%"
          )

      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          # Desactivamos clean para evitar errores EPERM en Windows cuando archivos están bloqueados
          clean: false

      - name: Instalar y Construir
        shell: cmd
        run: |
          echo === Trabajando en el Workspace del Runner ===
          :: Instalamos y generamos la carpeta 'dist'
          call npm install
          call npm run build

      - name: Despliegue al servidor (Copia de Build)
        shell: cmd
        run: |
          echo === Copiando build a D:\APP\swamp-website-react ===
          
          :: Verificar existencia del origen
          if not exist "%GITHUB_WORKSPACE%\dist" (
              echo ERROR: No se encontró la carpeta dist generada por el build.
              exit /b 1
          )

          :: Crear el directorio de destino si no existe
          if not exist "D:\APP\swamp-website-react" mkdir "D:\APP\swamp-website-react"
          
          :: Usar robocopy para sincronizar la carpeta 'dist' con el destino
          :: /MIR: Espejo (Mirror), mantiene el destino idéntico al origen
          :: /R:3: 3 reintentos en caso de archivos bloqueados
          :: /W:5: 5 segundos de espera entre reintentos
          :: IMPORTANTE: robocopy devuelve códigos 0-7 para éxito. >=8 es falla.
          robocopy "%GITHUB_WORKSPACE%\dist" "D:\APP\swamp-website-react" /MIR /R:3 /W:5
          
          if %ERRORLEVEL% LSS 8 (
              echo === Despliegue completado con éxito en D:\APP\swamp-website-react ===
              exit /b 0
          ) else (
              echo === ERROR fatal durante la copia (Código Robocopy: %ERRORLEVEL%) ===
              exit /b %ERRORLEVEL%
          )